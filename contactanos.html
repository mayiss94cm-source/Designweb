	<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="text-center mb-4">
        <h2 class="fw-bold" style="color: #0756a5;">
          Contáctanos
        </h2>
        <p class="text-muted">
          ¿Tienes alguna pregunta o sugerencia?
          ¡Queremos escucharte!
        </p>
      </div>

      <form>
        <!-- Nombre -->
        <div class="mb-3">
          <label for="nombre" class="form-label">
            Nombre completo
          </label>
          <input
            type="text"
            class="form-control"
            id="nombre"
            placeholder="Escribe tu nombre"
            required>
        </div>

        <!-- Correo -->
        <div class="mb-3">
          <label for="correo" class="form-label">
            Correo electrónico
          </label>
          <input
            type="email"
            class="form-control"
            id="correo"
            placeholder="nombre@ejemplo.com"
            required>
        </div>

        <!-- Asunto -->
        <div class="mb-3">
          <label for="asunto" class="form-label">
            Asunto
          </label>
          <select class="form-select" id="asunto" required>
            <option value="" selected disabled>
              Selecciona una opción
            </option>
            <option>Información sobre productos</option>
            <option>Peticiones y sugerencias</option>
            <option>Quejas y reclamos</option>
            <option>Otros</option>
          </select>
        </div>

        <!-- Mensaje -->
        <div class="mb-3">
          <label for="mensaje" class="form-label">
            Mensaje
          </label>
          <textarea
            class="form-control"
            id="mensaje"
            rows="4"
            placeholder="Escribe tu mensaje aquí..."
            required></textarea>
        </div>

        <!-- Aceptación -->
        <div class="form-check mb-4">
          <input
            class="form-check-input"
            type="checkbox"
            id="privacidad"
            required>
          <label class="form-check-label" for="privacidad">
            Acepto el tratamiento de mis datos personales.
          </label>
        </div>

        <!-- Botón -->
        <div class="d-grid">
          <button
            type="submit"
            class="btn btn-primary btn-lg">
            Enviar mensaje
          </button>
        </div>
      </form>

    </div>
  </div>
</section>
